<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>XAurora</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;color:#f4f4f4;background:#777}
body{background:linear-gradient(180deg,rgba(35,36,39,.88),rgba(205,205,205,.94)),radial-gradient(ellipse at 50% 15%,#aaa,#555);display:flex;flex-direction:column}
header{height:15vh;min-height:66px;display:flex;align-items:flex-end;justify-content:center;gap:clamp(12px,3vw,48px);padding:0 2vw 12px;white-space:nowrap}
nav{font-size:clamp(15px,2.5vw,34px);font-weight:300;color:#aaa;opacity:.85;cursor:pointer;padding-bottom:7px}nav.active{color:#fff;opacity:1}
main{height:85vh;position:relative;padding:1vh 4vw}
.dashboard{height:72%;display:grid;grid-template-columns:minmax(115px,15vw) 1fr minmax(110px,15vw);gap:8px;max-width:1120px;margin:auto}
.left,.right{display:flex;flex-direction:column;gap:5px;padding-top:0}
.tile{background:rgba(0,145,18,.84);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:14px;min-height:0;flex:1;box-shadow:0 2px 5px #4445;font-size:clamp(12px,1.7vw,20px);cursor:pointer}
.tile.selected{background:#159b22;outline:3px solid #ddd;z-index:2;transform:scale(1.035)}
.symbol{font-size:clamp(25px,4vw,48px);align-self:center}
.feature{background:#171717;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:14px;min-width:0}
.logo{width:clamp(62px,9vw,110px);height:clamp(62px,9vw,110px);border-radius:50%;background:radial-gradient(circle at 35% 25%,#fff,#bbb 68%,#888);position:relative;margin-bottom:8px;box-shadow:0 2px 9px #0008}
.logo:before,.logo:after{content:"";position:absolute;background:#159b27;width:22%;height:82%;top:8%;left:40%;border-radius:100% 0 100% 0;transform:rotate(42deg)}
.logo:after{transform:rotate(-42deg);left:40%}
.feature h1{font-size:clamp(25px,4.2vw,56px);font-weight:300;margin:0 0 10px}
.icons{color:#aaa;font-size:clamp(15px,2vw,24px);letter-spacing:18px}
.feature p{align-self:stretch;text-align:left;margin-top:auto;font-size:clamp(11px,1.5vw,18px);line-height:1.35}
.right .tile{opacity:.75}
.hint{position:absolute;bottom:5vh;left:7vw;font-size:clamp(12px,1.5vw,19px);color:#eee}
.hint b{background:#45b54e;color:#fff;border-radius:50%;padding:3px 8px;margin-right:8px}
.panel{display:none;position:absolute;inset:2vh 4vw 7vh;background:#252525f2;padding:24px;overflow:auto;box-shadow:0 5px 30px #0007}
.panel.show{display:block}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}.card{background:#148a24;padding:22px;min-height:100px;font-size:18px}
#intro{position:fixed;inset:0;background:#080808;z-index:10;display:flex;align-items:center;justify-content:center;flex-direction:column}
#intro iframe{width:min(92vw,1100px);height:min(55vw,62vh);border:0}
#intro button{margin-top:18px;padding:14px 30px;background:#159b27;color:white;border:0;font-size:17px}
#intro small{color:#aaa;margin-top:8px}
@media(max-width:600px){header{gap:10px;padding-bottom:8px}nav{font-size:13px}.dashboard{grid-template-columns:23vw 1fr 19vw;gap:4px}.tile{padding:7px}.feature{padding:7px}.icons{letter-spacing:7px}}
</style></head><body>
<div id="intro"><iframe id="startup" src="https://www.youtube-nocookie.com/embed/vDfhD8Tj3qk?autoplay=1&mute=1&controls=0&rel=0&playsinline=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe><button onclick="enter()">Enter XAurora</button><small>Startup video • Tap Enter if playback doesn't start</small></div>
<header><nav class="active" onclick="tab('home',this)">home</nav><nav onclick="tab('social',this)">social</nav><nav onclick="tab('games',this)">games</nav><nav onclick="tab('media',this)">tv &amp; movies</nav><nav onclick="tab('music',this)">music</nav><nav onclick="tab('apps',this)">apps</nav><nav onclick="tab('settings',this)">settings</nav></header>
<main><section class="dashboard" id="dash">
<div class="left"><div class="tile selected" onclick="selectTile(this,'Open Tray')"><span class="symbol">⏏</span><span>Open Tray</span></div><div class="tile" onclick="selectTile(this,'My Pins')"><span class="symbol">📌</span><span>My Pins</span></div><div class="tile" onclick="selectTile(this,'Recent')"><span class="symbol">◷</span><span>Recent</span></div></div>
<div class="feature"><div class="logo"></div><h1 id="featureTitle">XBOX LIVE</h1><div class="icons">🎮 ▣ ♧</div><p id="featureText">Connect your Xbox 360 to the Internet to explore games, entertainment, and more</p></div>
<div class="right"><div class="tile" onclick="selectTile(this,'Friends')"><span class="symbol">♟</span><span>Friends</span></div><div class="tile" onclick="selectTile(this,'Avatar Store')"><span class="symbol">♙</span><span>Avatar Store</span></div><div class="tile" onclick="selectTile(this,'Sign In')"><span class="symbol">☻</span><span>Sign In or Out</span></div></div>
</section><section class="panel" id="panel"><h2 id="heading">GAMES</h2><div class="cards" id="cards"></div></section><div class="hint"><b>A</b> Select &nbsp;&nbsp; <b>B</b> Back</div></main>
<script>
const data={social:['Profile','Friends','Messages','Achievements'],games:['Game Library','My Pins','Recently Played','Add Game'],media:['TV','Movies','Video Player'],music:['Music Player','Albums','Artists'],apps:['Apps','Avatar Store','System Apps'],settings:['System Settings','Display','Audio','Storage','Network','About XAurora']};
function enter(){document.getElementById('intro').style.display='none'}
function selectTile(el,name){document.querySelectorAll('.tile').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');document.getElementById('featureTitle').textContent=name.toUpperCase();document.getElementById('featureText').textContent=name+' selected. Press A to open.'}
function tab(t,e){document.querySelectorAll('nav').forEach(x=>x.classList.remove('active'));e.classList.add('active');let p=document.getElementById('panel'),d=document.getElementById('dash');if(t==='home'){p.classList.remove('show');d.style.visibility='visible';return}d.style.visibility='hidden';p.classList.add('show');document.getElementById('heading').textContent=t.toUpperCase();document.getElementById('cards').innerHTML=(data[t]||[]).map(x=>'<div class="card" onclick="this.style.outline=\'3px solid white\'">'+x+'</div>').join('')}
document.addEventListener('keydown',e=>{if(e.key==='Escape'||e.key==='Backspace'){document.querySelector('nav').click()}});
</script></body></html>
