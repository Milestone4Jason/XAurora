<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta charset="utf-8"><title>XAurora</title><style>
*{box-sizing:border-box}body{margin:0;background:#171717;color:#fff;font-family:Arial;overflow:hidden}.top{height:58px;background:#252525;display:flex;align-items:center;gap:22px;padding:0 4%;white-space:nowrap}.brand{font-size:22px;color:#62d56e;font-weight:bold}.nav{padding:18px 0;opacity:.65}.active{opacity:1;border-bottom:3px solid #39b54a}main{height:calc(100vh - 58px);padding:4vh 4vw;background:radial-gradient(ellipse at 70% 40%,#444,#171717 75%)}.hero{display:flex;height:65%;gap:18px}.tile{width:155px;background:linear-gradient(145deg,#36c64d,#087b20);padding:20px;display:flex;flex-direction:column;justify-content:space-between}.feature{flex:1;background:#080808;border:1px solid #555;display:grid;place-content:center;text-align:center}.feature h1{font-size:40px;font-weight:300}.x{font-size:75px;color:#39b54a}.panel{display:none;position:absolute;inset:80px 4vw 4vh;background:#222e;border:1px solid #555;padding:24px;overflow:auto}.panel.show{display:block}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.item{background:#333;padding:20px;min-height:90px}button{background:#248e36;color:white;border:0;padding:12px;margin:6px}@media(max-width:700px){.top{gap:10px;padding:0 10px;font-size:12px}.brand{font-size:15px}.tile{width:90px;padding:10px}.feature h1{font-size:25px}.grid{grid-template-columns:repeat(2,1fr)}}</style></head><body>
<header class="top"><div class="brand">✕ XAurora</div><div class="nav active" onclick="tab('home',this)">Home</div><div class="nav" onclick="tab('social',this)">Social</div><div class="nav" onclick="tab('games',this)">Games</div><div class="nav" onclick="tab('media',this)">TV & Movies</div><div class="nav" onclick="tab('music',this)">Music</div><div class="nav" onclick="tab('apps',this)">Apps</div><div class="nav" onclick="tab('settings',this)">Settings</div></header>
<main><section class="hero" id="hero"><div class="tile"><div style="font-size:45px">⏏</div><b onclick="alert('Virtual tray opened')">Open Tray</b></div><div class="feature"><div class="x">X</div><h1 id="heroTitle">XBOX LIVE</h1><p>Games • Entertainment • More</p></div></section><section class="panel" id="panel"><h2 id="heading"></h2><div id="content"></div></section></main>
<script>
function tab(t,e){document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));e.classList.add('active');document.getElementById('hero').style.display=t==='home'?'flex':'none';let p=document.getElementById('panel');p.classList.toggle('show',t!=='home');if(t==='home')return;document.getElementById('heading').textContent=t.toUpperCase();let d={social:['Profile','Friends','Achievements'],games:['Game Library','Collections','Recently Played'],media:['Video Player','TV','Movies'],music:['Music Player','Albums','Artists'],apps:['Apps','Dashboard','Storage'],settings:['Classic Dashboard','Aurora Dashboard','Display','Audio','About']};document.getElementById('content').innerHTML='<div class="grid">'+d[t].map(x=>'<div class="item">'+x+'</div>').join('')+'</div><p>XAurora is a dashboard simulator, not an Xbox 360 emulator.</p>'}
</script></body></html>
